<h1>词缀</h1>
<p>&nbsp;</p>
<p>下面列出物品属性的说明，最直观、不言自明的属性除外。</p>
<p>&nbsp;</p>
<figure class="table" style="float:left;">
  <table>
    <thead>
      <tr>
        <th>词缀</th>
        <th>说明</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>你感觉自己虚体化…（You feel incorporeal...）</td>
        <td>让角色呈现消散/透明效果</td>
      </tr>
      <tr>
        <td>被击杀的怪物安息吧（Slain Monsters Rest in Peace）</td>
        <td>防止被击杀的怪物被复活，或被敌人用于尸体爆炸类技能（如尼拉塞克）</td>
      </tr>
      <tr>
        <td>+x 技能（未标注职业或充能）</td>
        <td>
          <p>为穿戴该物品的任意角色提供所指技能。</p>
          <p>例：<i>+1 闪避（Dodge）</i>（闪避者符文之语）让你的角色或佣兵获得亚马逊的闪避技能。</p>
        </td>
      </tr>
      <tr>
        <td>x 级技能（带充能）</td>
        <td>为穿戴该物品的任意角色提供所指技能，使用次数受充能数限制。修理装备可补充充能。</td>
      </tr>
      <tr>
        <td>打击恢复加速（FHR）&nbsp;</td>
        <td>
          <p>提升被击中后的恢复速度。以帧计量，每个职业/佣兵的基础恢复帧数不同。&nbsp;</p>
          <p>只有超过 FHR 档位（使恢复动画减少 1 帧/提速所需的总体 FHR%）才会改善。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>施法速度加速（FCR）&nbsp;</td>
        <td>
          <p>提升法术施放速度。以帧计量，每个职业/佣兵（第三幕）的基础施法帧数不同。&nbsp;</p>
          <p>只有超过 FCR 档位（使施法动画减少 1 帧/提速所需的总体 FCR%）才会改善。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>格挡速度加速（FBR）</td>
        <td>
          <p>提升格挡速度。以帧计量，每个职业的基础格挡帧数不同。&nbsp;</p>
          <p>只有超过 FBR 档位（使格挡动画减少 1 帧/提速所需的总体 FBR%）才会改善。&nbsp;</p>
        </td>
      </tr>
      <tr>
        <td>所受伤害的 x% 转为法力</td>
        <td>
          <p>按所受伤害的百分比补充法力池。&nbsp;</p>
          <p>不会减少所受伤害。</p>
        </td>
      </tr>
      <tr>
        <td>阻止怪物恢复生命</td>
        <td>防止怪物自然回血，但仍可被法术治疗。</td>
      </tr>
      <tr>
        <td>x% 造成开放性伤口</td>
        <td>
          <p>对怪物施加流血类效果，持续造成伤害。&nbsp;</p>
          <p>随玩家等级成长（原版约 8 秒 2000 点伤害，D2RR 中是否调整待定）</p>
          <p>对头目效果减半。</p>
          <p>对 PVP 效果为四分之一。</p>
          <p>远程攻击再减半。</p>
        </td>
      </tr>
      <tr>
        <td>x% 致命一击</td>
        <td>
          <p>概率造成双倍伤害。&nbsp;</p>
          <p>在其他修正/加成之上生效，但不与致命打击（Critical Strike）等同类效果叠加。</p>
        </td>
      </tr>
      <tr>
        <td>x% 压碎性打击</td>
        <td>
          <p>概率按比例削减怪物生命值。</p>
          <p>比例：对普通怪物 25%，对头目 12.5%，对玩家 10%。</p>
          <p>远程攻击减半。</p>
        </td>
      </tr>
      <tr>
        <td>元素/魔法吸收</td>
        <td>
          <p>按指定百分比减少伤害，并将吸收的量转化为治疗。</p>
          <p>在抗性减伤之后结算。</p>
        </td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
      </tr>
      <tr>
        <td>未完待续</td>
        <td>…</td>
      </tr>
    </tbody>
  </table>
</figure>
