<p style="text-align:center;">&nbsp;</p>
<p style="text-align:center;"><span class="text-huge">（旋风）附魔女攻略</span></p>
<p>我们再也不必整天用软绵绵的手臂施法、让佣兵替我们敲怪抗伤了。</p>
<p>现在轮到我们潇洒地转着圈挥舞敲打了，像一台火焰搅拌机。</p>
<p>我们甚至自己抗伤害，否则就得死。好玩！</p>
<p>把这些装备当成一个大致的建议，很可能有更好的玩法。</p>
<p><span class="text-huge">示例：</span></p>
<figure class="image"><img src="/enchguide3.png">
  <figcaption>没有专门的 buff 装备，只用技能护符、湮灭（Anni）、火炬（Torch）满。上 buff 时穿 +技能、火焰技能、强化（Enchant）装备，然后换回普通装备</figcaption>
</figure>
<p><span class="text-huge">属性目标：</span></p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td>带 BO（战斗号令）时 2000+ HP<br>带 BO 时 800+ 法力<br>75% 格挡率<br>300%+ 全抗，最终达到<br>95% 全抗（毒素可以是 85%，用解毒剂临时提 10%）<br>&nbsp;</td>
        <td>用于基本生存</td>
      </tr>
      <tr>
        <td>平均 20k - 100k+ 火焰伤害<br>-75%+ 敌人火焰抗</td>
        <td>用于一两下就打倒东西</td>
      </tr>
      <tr>
        <td>10k+ AR（旋风用）<br><br>&nbsp;</td>
        <td>用于 90 级时对三大有 70% 命中几率</td>
      </tr>
      <tr>
        <td>50%+ CB</td>
        <td>如果伤害够高你就不需要这个</td>
      </tr>
      <tr>
        <td>% 撕裂伤口（Open Wounds）</td>
        <td>如果 AR 偏低、三大在两次攻击间回血太多</td>
      </tr>
      <tr>
        <td>无法被冻结</td>
        <td>防止被减速冻结，有这条永远是好主意</td>
      </tr>
      <tr>
        <td>
          <p>轻刃（Phaseblade）14% IAS</p>
          <p>狂战士斧（Berserker Axe）68% IAS</p>
        </td>
        <td>以达到旋风 4 FPA 阈值</td>
      </tr>
    </tbody>
  </table>
</figure>
